<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jadiouo — robotics, control, planning</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="handle">github.com/Jadiouo</p>

      <p class="tagline" id="tagline"></p>
      <p class="tagline-en" id="tagline-en"></p>

  <main class="wrap">
    <section id="featured">
      <h2>精選 <span class="en">Featured</span></h2>

      <div id="groups"></div>
    </section>

    <section id="about">
      <h2>關於 <span class="en">About</span></h2>
      <div id="about-body"></div>
    </section>
  </main>

  <footer class="wrap muted">
    <p>Built with plain HTML/CSS/JS · data via the GitHub API · <a href="https://github.com/Jadiouo/Jadiouo.github.io">source</a></p>

  <script src="config.js"></script>
  <script src="app.js"></script>
